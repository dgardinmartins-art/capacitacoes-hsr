.bt.espera::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(18,63,107,.45);animation:enche var(--t,6s) linear forwards}

.campo{display:block;width:100%;min-height:3rem;margin:.4rem 0 .8rem;padding:.6rem .8rem;border:2px solid var(--linha);border-radius:.55rem;background:var(--papel);font-size:1.05rem}

.chip.ativa{background:var(--azul);color:#fff}
.rolagem{overflow-x:auto}
.tab{width:100%;border-collapse:collapse;background:var(--papel)}
.tab th,.tab td{padding:.45rem .6rem;border-bottom:1px solid var(--linha);text-align:left;font-size:.88rem;vertical-align:top}

.tag{display:inline-block;padding:.05rem .55rem;border-radius:1rem;font-size:.8rem;font-weight:700;white-space:nowrap}
.tag.feito{background:var(--verde-claro);color:var(--verde)}

.aniv{display:flex;align-items:center;gap:.4rem;white-space:nowrap}
dialog{width:100%;max-width:min(48rem,94vw);max-height:90vh;overflow:auto;border:0;border-radius:.8rem;padding:1.2rem;color:var(--tinta)}
dialog::backdrop{background:rgba(16,38,59,.55)}
.rel h1{font-size:1.4rem}
.rel h2{font-size:1.1rem;border-bottom:1px solid var(--linha);padding-bottom:.2rem}
.rel .formula{background:var(--fundo);padding:.6rem .8rem;border-radius:.3rem}

@media (prefers-reduced-motion:reduce){.ficha.vira,.estrelas.pop svg.on{animation:none}}

  html,html.grande{font-size:11pt}

}

async function copiar(texto, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(texto); ok = true; } catch (e) {
    try {
      const ta = h('textarea', { style: 'position:fixed;opacity:0' }); ta.value = texto; document.body.append(ta); ta.select();
      ok = document.execCommand('copy'); ta.remove();
    } catch (e2) {}
  }
  const txt = btn.textContent;
  btn.textContent = ok ? 'Lista copiada' : 'Não deu para copiar';
  setTimeout(() => { if (btn.isConnected) btn.textContent = txt; }, 2000);
}

async function admPessoas() {
  const d = await arpc('cap_adm_pessoas', { p_mes: S.admMes });
  d.pessoas.sort(porNome);
  const corpo = h('tbody');
  const busca = h('input', { type: 'search', class: 'campo', placeholder: 'Buscar pessoa', 'aria-label': 'Buscar pessoa' });
  function linhaPessoa(p) {
    let gravando = false;
    const aniv = h('input', { class: 'campo mini', inputmode: 'numeric', maxlength: '5', placeholder: 'DD/MM', 'aria-label': 'Aniversário de ' + p.nome });
    const st = h('span', { class: 'tag ' + (p.tem_pin ? 'feito' : 'pendente') }, p.tem_pin ? 'cadastrado' : 'falta');
    async function grava() {
      const v = aniv.value.replace(/\D/g, '');
      if (!v || gravando) return;
      if (v.length !== 4) { st.className = 'tag pendente'; st.textContent = 'use DD/MM'; return; }
      gravando = true; st.className = 'tag andamento'; st.textContent = 'gravando';
      try {
        await arpc('cap_adm_salvar_pessoa', { p_dados: { id: p.id, aniversario: v } });
        p.tem_pin = true; aniv.value = ''; st.className = 'tag feito'; st.textContent = 'cadastrado';
      } catch (e) {
        const m = erroAdm(e);
        st.className = 'tag pendente'; st.textContent = e.cod === 'ANIVERSARIO' ? 'data inválida' : (m ? 'erro, tente de novo' : '');
      }
      gravando = false;
    }
    aniv.addEventListener('input', () => { const v = aniv.value.replace(/\D/g, '').slice(0, 4); aniv.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v; });
    aniv.addEventListener('blur', grava);
    aniv.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      const prox = aniv.closest('tr').nextElementSibling;
      grava().then(() => { const i = prox && prox.querySelector('input.mini'); if (i) i.focus(); });
    });
    const afast = h('input', { type: 'checkbox', checked: p.afastado, 'aria-label': 'Afastado em ' + mesExt(d.mes), onchange: async e => {
      const cx = e.target;
      try { await arpc('cap_adm_afastar', { p_pessoa: p.id, p_mes: d.mes, p_afastado: cx.checked, p_motivo: '' }); p.afastado = cx.checked; }
      catch (err) { cx.checked = !cx.checked; erroAdm(err); }
    } });
    return h('tr', { class: p.ativo ? '' : 'inativo' },
      h('td', null, p.nome, p.admin ? [' ', h('span', { class: 'tag andamento' }, 'administração')] : null),
      h('td', null, p.funcao), h('td', null, TRILHA[p.trilha]),
      h('td', null, h('div', { class: 'aniv' }, aniv, st)),
      h('td', null, afast),
      h('td', null, p.ativo ? 'Ativa' : 'Inativa'),
      h('td', null, h('button', { type: 'button', class: 'chip', onclick: () => formPessoa(p, () => vAdm('pessoas')) }, 'Editar')));
  }
  function pinta() {
    const q = semAcento(busca.value.trim());
    corpo.replaceChildren(...d.pessoas.filter(p => !q || semAcento(p.nome + ' ' + p.funcao).includes(q)).map(linhaPessoa));
  }
  busca.addEventListener('input', pinta);
  pinta();
  const falta = d.pessoas.filter(p => p.ativo && !p.tem_pin).length;
  return [
    h('div', { class: 'linha-topo' }, h('h1', null, 'Pessoas'),
      h('button', { type: 'button', class: 'chip', onclick: () => formPessoa(null, () => vAdm('pessoas')) }, 'Nova pessoa')),
    h('p', { class: 'indicador' }, falta
      ? `Faltam ${falta} aniversários. Sem o dia e o mês cadastrados a pessoa não consegue entrar. Digite DD/MM e aperte Enter para ir à próxima linha.`
      : 'Todas as pessoas ativas já têm o aniversário cadastrado.'),
    h('p', { class: 'miudo' }, `O aniversário não fica visível depois de gravado. "Afastado" vale para ${mesExt(d.mes)} e tira a pessoa do público-alvo do mês (férias, atestado, licença).`),
    busca,
    h('div', { class: 'rolagem' }, h('table', { class: 'tab' },
      h('thead', null, h('tr', null, ['Nome', 'Função', 'Trilha', 'Aniversário (PIN)', 'Afastado no mês', 'Situação', ''].map(t => h('th', null, t)))),
      corpo))
  ];
}

// --- cursos
async function admCurso(id) {
  const dlg = h('dialog');
  const fecha = () => { dlg.close(); dlg.remove(); };
  dlg.append(h('p', { class: 'guia' }, 'Carregando...'));
  document.body.append(dlg); dlg.showModal();
  dlg.addEventListener('close', () => dlg.remove());
  let c;
  try { c = await arpc('cap_adm_curso', { p_id: id }); } catch (e) { fecha(); erroAdm(e); return; }
  poe(dlg,
    h('h2', { style: 'margin-top:0' }, c.titulo),
    h('p', { class: 'miudo' }, `${mesExt(c.competencia)}. Para: ${c.trilhas.map(t => TRILHA[t]).join(', ')}. Carga horária: ${c.carga_horaria_min} minutos. Para passar: ${Math.ceil(c.n_questoes * c.nota_minima / 100)} de ${c.n_questoes} acertos (${c.nota_minima}%). ${c.n_questoes} perguntas por tentativa, sorteadas de ${c.questoes.length}.`),
    h('p', null, h('strong', null, 'Objetivo: '), c.objetivo),
    h('p', null, h('strong', null, 'Conteúdo: '), c.conteudo),
    h('p', null, h('strong', null, 'Texto-base: '), c.fonte),
    h('p', null, h('strong', null, 'Responsável técnico: '), c.resp_nome + (c.resp2_nome ? '. Autoria do conteúdo: ' + c.resp2_nome : '')),
    h('h2', null, `Cartões (${c.cartoes.length})`),
    c.cartoes.map(k => h('div', { class: 'rev' }, h('p', { class: 'rev-q' }, `${k.ordem}. ${k.frente}`), h('p', null, k.verso))),
    h('h2', null, `Banco de perguntas (${c.questoes.length})`),
    c.questoes.map((q, i) => h('div', { class: 'rev' }, h('p', { class: 'rev-q' }, `${i + 1}. ${q.enunciado}`),
      q.alternativas.map((a, k) => h('p', { class: k === q.correta ? 'rev-certa' : '' }, (k === q.correta ? 'Certa: ' : 'Errada: ') + a)),
      q.explicacao ? h('p', { class: 'miudo' }, q.explicacao) : null)),
    h('button', { type: 'button', class: 'bt sec fino', onclick: fecha }, 'Fechar'));
}
async function admCursos() {
  const cs = await arpc('cap_adm_cursos');
  const aviso = h('p', { class: 'erro', role: 'alert' });
  async function muda(c, status, prazo, btn) {
    await ocupa(btn, async () => {
      try { await arpc('cap_adm_curso_status', { p_id: c.id, p_status: status, p_fecha_em: prazo }); return vAdm('cursos'); }
      catch (e) { aviso.textContent = erroAdm(e); }
    });
  }
  return [
    h('h1', null, 'Cursos'),
    h('p', { class: 'miudo' }, 'Os cursos de cada mês são montados a partir dos textos-base aprovados pelo responsável técnico. Aqui você confere o conteúdo, põe no ar, tira do ar e ajusta o prazo.'),
    aviso,
    cs.length ? h('div', { class: 'rolagem' }, h('table', { class: 'tab' },
      h('thead', null, h('tr', null, ['Mês', 'Curso', 'Para', 'Cartões', 'Perguntas', 'Situação', 'Prazo', ''].map(t => h('th', null, t)))),
      h('tbody', null, cs.map(c => {
        const prazo = h('input', { type: 'date', class: 'campo mini', style: 'width:9.5rem', value: c.fecha_em, min: c.abre_em, 'aria-label': 'Prazo de ' + c.titulo });
        return h('tr', null,
          h('td', null, mesExt(c.competencia)),
          h('td', null, c.titulo + (c.teste ? ' (demonstração)' : '')),
          h('td', null, c.trilhas.map(t => TRILHA[t]).join(', ')),
          h('td', null, String(c.n_cartoes)),
          h('td', null, `${c.n_questoes} de ${c.n_banco}`),
          h('td', null, h('span', { class: 'tag ' + (c.status === 'publicado' ? 'feito' : c.status === 'rascunho' ? 'andamento' : 'afastado') }, ST[c.status])),
          h('td', null, h('div', { class: 'aniv' }, prazo, h('button', { type: 'button', class: 'chip', onclick: e => muda(c, null, prazo.value, e.currentTarget) }, 'Salvar prazo'))),
          h('td', null, h('div', { class: 'filtros', style: 'margin:0' },
            h('button', { type: 'button', class: 'chip', onclick: () => admCurso(c.id) }, 'Ver conteúdo'),
            c.status === 'publicado'
              ? h('button', { type: 'button', class: 'chip', onclick: e => muda(c, 'rascunho', null, e.currentTarget) }, 'Tirar do ar')
              : h('button', { type: 'button', class: 'chip ativa', onclick: e => muda(c, 'publicado', null, e.currentTarget) }, 'Pôr no ar'))));
      })))) : h('p', { class: 'vazio' }, 'Nenhum curso cadastrado ainda.')
  ];
}

  return h('article', { class: 'rel' },
    h('p', { class: 'comp-org' }, 'Hospital São Roque', h('br'), h('span', null, 'Sociedade Hospitalar de Caiçara - CNPJ 90.899.444/0001-01 - Rua Dom Pedro I, nº 810, Caiçara/RS')),
    h('h1', null, 'Relatório de Educação Permanente'),
    h('p', null, h('strong', null, 'Período: '), `${periodo} (${dia(r.inicio)} a ${dia(r.fim)})`),
    h('h2', null, 'Indicador do Documento Descritivo'),
    h('p', null, 'Porcentual de profissionais do público-alvo treinados. Fonte: controle interno do hospital para treinamento (aplicativo Capacitações HSR).'),
    h('div', { class: 'formula' },
      h('p', null, 'Fórmula: (funcionários que receberam o treinamento) ÷ (número de treinamentos × funcionários que deveriam recebê-lo) × 100'),

      h('p', { class: 'miudo' }, `Treinamentos no período: ${ind.treinamentos}. O denominador soma o público-alvo de cada treinamento. Meta almejada: 6% ou mais. Meta aceitável: 5% ou mais.`)),
    r.cursos.length ? [
      h('h2', null, 'Resumo'),
      h('table', { class: 'tab' },
        h('thead', null, h('tr', null, ['Treinamento', 'Mês', 'Público-alvo', 'Concluíram', 'Adesão'].map(t => h('th', null, t)))),
        h('tbody', null, r.cursos.map(c => h('tr', null, h('td', null, c.titulo), h('td', null, mesExt(c.competencia)),
          h('td', null, String(c.publico)), h('td', null, String(c.feitos)), h('td', null, pct(c.feitos, c.publico))))))] : null,
    r.cursos.map(c => h('section', null,
      h('h2', null, `${c.titulo} (${mesExt(c.competencia)})`),
      h('p', null, h('strong', null, 'Objetivo: '), c.objetivo),
      h('p', null, h('strong', null, 'Conteúdo ministrado: '), c.conteudo),
      h('p', null, h('strong', null, 'Texto-base: '), c.fonte),
      h('p', null, h('strong', null, 'Modalidade e critério: '), `a distância, pelo aplicativo, com acesso individual. ${c.n_cartoes} cartões de leitura obrigatória e ${c.n_questoes} perguntas sorteadas a cada tentativa, com aproveitamento mínimo de ${c.nota_minima}% (${Math.ceil(c.n_questoes * c.nota_minima / 100)} de ${c.n_questoes} acertos). Carga horária: ${c.carga} minutos. Disponível de ${dia(c.abre_em)} a ${dia(c.fecha_em)}.`),
      h('p', null, h('strong', null, 'Público-alvo: '), c.trilhas.map(t => TRILHA[t]).join(', ') + `. ${c.publico} pessoas.`),
      h('p', null, h('strong', null, 'Responsável técnico: '), c.resp_nome + (c.resp_formacao ? ', ' + c.resp_formacao : '') + '.' + (c.resp2_nome ? ' Autoria do conteúdo: ' + c.resp2_nome + (c.resp2_formacao ? ', ' + c.resp2_formacao : '') + '.' : '')),
      h('table', { class: 'tab' },
        h('thead', null, h('tr', null, ['Nome', 'Função', 'Situação', 'Concluiu em', 'Acertos', 'Tempo', 'Código'].map(t => h('th', null, t)))),
        h('tbody', null, c.pessoas.slice().sort(porNome).map(p => h('tr', null,
          h('td', null, p.nome), h('td', null, p.funcao),
          h('td', null, SIT[p.situacao] + (p.no_publico ? '' : ' (fora do público-alvo)')),
          h('td', null, p.concluido_em ? dataHora(p.concluido_em) : ''),
          h('td', null, p.acertos != null ? `${p.acertos} de ${p.total}` : ''),
          h('td', null, p.concluido_em ? dur(p.tempo_seg) : ''),

    h('p', { class: 'miudo' }, `Emitido em ${dataHora(r.gerado_em)} por ${r.gerado_por}, pelo aplicativo Capacitações HSR.`));
}
async function admRelatorio() {
  const base = S.admMes ? partes(S.admMes) : [String(new Date().getFullYear()), String(new Date().getMonth() + 1)];
  const tipo = h('select', { class: 'campo curto' }, h('option', { value: 'mes' }, 'Um mês'), h('option', { value: 'tri' }, 'Um trimestre'));
  const mes = h('select', { class: 'campo curto', 'aria-label': 'Mês' }, MESES.map((m, i) => h('option', { value: i + 1, selected: i + 1 === Number(base[1]) }, m)));
  const tri = h('select', { class: 'campo curto', 'aria-label': 'Trimestre', hidden: true }, [1, 2, 3, 4].map(t => h('option', { value: t, selected: t === Math.ceil(Number(base[1]) / 3) }, `${t}º trimestre`)));
  const ano = h('input', { class: 'campo curto', type: 'number', min: '2026', max: '2100', value: base[0], style: 'min-width:6rem;width:6.5rem', 'aria-label': 'Ano' });
  tipo.addEventListener('change', () => { mes.hidden = tipo.value !== 'mes'; tri.hidden = tipo.value !== 'tri'; });
  const saida = h('div');
  const bt = h('button', { type: 'button', class: 'bt fino', style: 'width:auto;margin:0' }, 'Gerar relatório');
  const z = n => String(n).padStart(2, '0');
  bt.addEventListener('click', () => ocupa(bt, async () => {
    const a = Number(ano.value);
    let m1, m2, rotulo;
    if (tipo.value === 'mes') { m1 = m2 = Number(mes.value); rotulo = `${MESES[m1 - 1]} de ${a}`; }
    else { const t = Number(tri.value); m1 = (t - 1) * 3 + 1; m2 = m1 + 2; rotulo = `${t}º trimestre de ${a}`; }
    const ini = `${a}-${z(m1)}-01`, fim = `${a}-${z(m2)}-${z(new Date(a, m2, 0).getDate())}`;
    try {
      const r = await arpc('cap_adm_relatorio', { p_ini: ini, p_fim: fim });
      saida.replaceChildren(
        h('button', { type: 'button', class: 'bt nao-imprime', onclick: () => window.print() }, 'Imprimir ou salvar em PDF'),
        docRelatorio(r, rotulo));
    } catch (e) { saida.replaceChildren(h('p', { class: 'erro' }, erroAdm(e))); }
  }));
  return [
    h('div', { class: 'nao-imprime' },
      h('h1', null, 'Relatório'),
      h('p', { class: 'miudo' }, 'Sai no formato do indicador do contrato com o Estado. A apuração da Comissão é trimestral.'),
      h('div', { class: 'filtros' }, tipo, mes, tri, ano, bt)),
    saida
  ];
}

// --- senha
async function admSenha() {
  const atual = h('input', { type: 'password', class: 'campo', autocomplete: 'current-password', required: true });
  const nova = h('input', { type: 'password', class: 'campo', autocomplete: 'new-password', required: true, minlength: '8' });
  const rep = h('input', { type: 'password', class: 'campo', autocomplete: 'new-password', required: true, minlength: '8' });
  const msg = h('p', { class: 'erro', role: 'alert' });
  const bt = h('button', { type: 'submit', class: 'bt' }, 'Trocar a senha');
  return h('form', { style: 'max-width:26rem', onsubmit: e => {
    e.preventDefault();
    ocupa(bt, async () => {
      msg.className = 'erro'; msg.textContent = '';
      if (nova.value !== rep.value) { msg.textContent = 'A senha nova não está igual nos dois campos.'; return; }
      try {
        const r = await arpc('cap_adm_senha', { p_atual: atual.value, p_nova: nova.value });
        if (r.ok) { msg.className = 'guia'; msg.textContent = 'Senha trocada.'; atual.value = nova.value = rep.value = ''; }
        else msg.textContent = r.motivo === 'atual' ? 'A senha atual não confere.' : 'A senha nova precisa ter pelo menos 8 caracteres.';
      } catch (err) { msg.textContent = erroAdm(err); }
    });
  } },
    h('h1', null, 'Minha senha'),
    h('p', { class: 'miudo' }, 'Esta é a senha da administração. Ela é diferente do PIN de aniversário, que serve só para fazer os cursos.'),
    h('label', null, 'Senha atual', atual),
    h('label', null, 'Senha nova (8 caracteres ou mais)', nova),
    h('label', null, 'Repita a senha nova', rep),
    msg, bt);
}

// ------------------------------------------------------------------ partida
document.addEventListener('keydown', e => { mexeu(); if (S.onKey && !e.target.closest('input, select, textarea')) S.onKey(e); });
document.addEventListener('click', mexeu, true);
try {
  history.replaceState({ cap: 0 }, '');
  history.pushState({ cap: 1 }, '');
  window.addEventListener('popstate', () => {
    if (document.querySelector('dialog[open]')) { document.querySelector('dialog[open]').close(); history.pushState({ cap: 1 }, ''); return; }
    if (S.voltar) { history.pushState({ cap: 1 }, ''); S.voltar(); } else history.back();
  });
} catch (e) {}

if (mem.lget('cap_letra') === 'g') document.documentElement.classList.add('grande');
const s0 = mem.get('cap_s'), a0 = mem.get('cap_a');
if (a0 && a0.token) { S.adm = a0.token; S.admNome = a0.nome; mexeu(); carregaNomes().catch(() => {}); vAdm('adesao'); }
else if (s0 && s0.token) { S.token = s0.token; S.nome = s0.nome; mexeu(); vInicio(); }
else vEntrar();
})();
